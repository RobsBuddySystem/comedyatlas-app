<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unsubscribed — COMEDY ATLAS</title>
<link rel="canonical" href="https://comedyatlas.app/comedy-atlas/newsletter/unsubscribed.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e1a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e2a3a;--text:#f0f0f0;--muted:#8899aa;--gold:#c9a84c}
@media (prefers-color-scheme: light){:root{--bg:#f7f5f0;--card:#ffffff;--border:#e2ddd2;--text:#171512;--muted:#5a5348;--gold:#766024}}
html,body{background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;line-height:1.5}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:520px;margin:0 auto;padding:60px 20px}
.logo{font-size:22px;font-weight:800;margin-bottom:28px}
.logo .dot{color:var(--gold)}
h1{font-size:22px;margin-bottom:8px}
p{margin-bottom:12px}
p.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:8px}
.state{font-size:14px;color:var(--muted);font-weight:700}
.links{margin-top:24px;font-size:14px}
.links a{margin-right:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">COMEDY ATLAS<span class="dot">.</span></div>
  <h1 id="nu-title">You're unsubscribed</h1>
  <p class="sub" id="nu-sub">You won't get any more newsletter emails from us.</p>

  <div class="card">
    <div class="state" id="nu-state">Unsubscribed</div>
    <p class="sub" style="margin-top:14px" id="nu-detail">
      Changed your mind? You can sign up again any time from the Atlas
      homepage.
    </p>
  </div>

  <div class="links">
    <a href="/comedy-atlas/">← Back to the Atlas</a>
  </div>
</div>

<script>
(function () {
  if ((navigator.language || "en").slice(0, 2) !== "fr") return;
  document.documentElement.lang = "fr";
  document.title = "Désinscription confirmée — COMEDY ATLAS";
  document.getElementById("nu-title").textContent = "Tu es désinscrit·e";
  document.getElementById("nu-sub").textContent = "Tu ne recevras plus d'e-mails de notre newsletter.";
  document.getElementById("nu-state").textContent = "Désinscrit·e";
  document.getElementById("nu-detail").textContent =
    "Tu changes d'avis ? Tu peux te réinscrire à tout moment depuis la page d'accueil de l'Atlas.";
  document.querySelector(".links a").textContent = "← Retour à l'Atlas";
})();
</script>
<script src="/comedy-atlas/atlas-track.js"></script>
</body>
</html>
